services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: reservation-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: reservation
      RABBITMQ_DEFAULT_PASS: reservation
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
